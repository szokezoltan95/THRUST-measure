name: Build and release THRUST-measure
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[gui]' pytest
      - name: Verify release version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $VERSION" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == release/v* && "$GITHUB_REF_NAME" != "release/v$VERSION" ]]; then
            echo "Release branch $GITHUB_REF_NAME does not match project version $VERSION" >&2
            exit 1
          fi
      - run: QT_QPA_PLATFORM=offscreen SDL_VIDEODRIVER=dummy python -m pytest -q
  windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Read project version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build standalone application
        run: |
          python -m pip install '.[gui]' pyinstaller
          python scripts/render_splash.py .release-assets/splash.png
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name THRUST-measure --icon THRUST.ico --splash .release-assets/splash.png --add-data "THRUST.ico;." --add-data "profiles;profiles" --collect-data thrust --copy-metadata thrust-measurement --hidden-import matplotlib.backends.backend_pdf main.py
          python -m PyInstaller --noconfirm --clean --onefile --name THRUST-updater scripts/thrust_updater.py
          Copy-Item dist/THRUST-updater.exe dist/THRUST-measure/
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path 'dist/THRUST-measure/*' -DestinationPath "release/THRUST-measure-$env:VERSION-windows-x64.zip" -Force
      - name: Compile GUI installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$env:VERSION" 'packaging\windows\THRUST-measure.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read project version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: python -m pip install '.[gui]' pyinstaller pillow
      - name: Bundle and package
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name THRUST-measure --add-data "THRUST.ico:." --add-data "profiles:profiles" --collect-data thrust --copy-metadata thrust-measurement --hidden-import matplotlib.backends.backend_pdf main.py
          python -m PyInstaller --noconfirm --clean --onefile --name THRUST-updater scripts/thrust_updater.py
          cp dist/THRUST-updater dist/THRUST-measure/
          mkdir -p release
          tar -czf "release/THRUST-measure-${VERSION}-linux-amd64.tar.gz" -C dist/THRUST-measure .
          python -c "from PIL import Image; im=Image.open('THRUST.ico'); im.thumbnail((256,256)); im.save('build/thrust-measure.png')"
          bash packaging/linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error
  macos:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read project version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: python -m pip install '.[gui]' pyinstaller
      - name: Bundle and package
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name THRUST-measure --add-data "THRUST.ico:." --add-data "profiles:profiles" --collect-data thrust --copy-metadata thrust-measurement --hidden-import matplotlib.backends.backend_pdf main.py
          python -m PyInstaller --noconfirm --clean --onefile --name THRUST-updater scripts/thrust_updater.py
          mkdir -p dist/THRUST-measure.app/Contents/MacOS release
          cp dist/THRUST-updater dist/THRUST-measure.app/Contents/MacOS/THRUST-updater
          ditto -c -k --sequesterRsrc --keepParent dist/THRUST-measure.app "release/THRUST-measure-${VERSION}-macos-${{ matrix.arch }}.zip"
          pkgbuild --component dist/THRUST-measure.app --install-location /Applications --identifier sk.tuke.lf.thrust.measure --version "$VERSION" "release/THRUST-measure-$VERSION-macos-${{ matrix.arch }}.pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            release/*.pkg
            release/*.zip
          if-no-files-found: error
  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read project version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: release
      - name: Publish versioned installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            TAG="v$VERSION"
          fi
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v version="$VERSION" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" "THRUST-measure--linux-amd64.tar.gz" --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
            if [[ -s "$NOTES_FILE" ]]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "THRUST-measure $VERSION" --notes-file "$NOTES_FILE"
            fi
          elif [[ -s "$NOTES_FILE" ]]; then
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "THRUST-measure $VERSION" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "THRUST-measure $VERSION" --generate-notes
          fi
