[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thrust-measurement"
version = "0.1.0"
description = "THRUST UAV pilot measurement launcher"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
gui = [
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.62.0",
    "kiwisolver==1.5.0",
    "matplotlib==3.10.8",
    "numpy==2.4.3",
    "packaging==26.0",
    "pandas==3.0.6",
    "pillow==12.1.1",
    "pygame-ce==2.5.7",
    "pyparsing==3.3.2",
    "PyQt6==6.10.2",
    "PyQt6-Qt6==6.10.2",
    "PyQt6_sip==13.11.1",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
]

[project.scripts]
thrust = "thrust.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["thrust*", "scope*", "simple*"]
namespaces = false

[tool.setuptools.package-data]
thrust = ["assets/*"]
