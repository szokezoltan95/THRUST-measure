[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thrust-measurement"
version = "0.1.0"
description = "THRUST UAV pilot measurement launcher"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
gui = [
    "pygame-ce>=2.5,<3",
    "PyQt6>=6.7,<7",
]

[project.scripts]
thrust = "thrust.app:main"

[project.gui-scripts]
thrust-measure = "thrust.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["thrust*", "scope*", "simple*"]
namespaces = false

[tool.setuptools.package-data]
thrust = ["assets/*"]
